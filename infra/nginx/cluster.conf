# Load balancer for `npm run dev:cluster`: :4000 -> booking-api instances on the host (:4001, :4002).
# Template: resolve-api-host.sh writes the final config to /etc/nginx/conf.d/default.conf at container start.
# Part of Phase 6's critical piece (graceful shutdown + retry policy), together with booking-api/src/shutdown.ts.

upstream booking_api {
  # __API_HOST__ = the Mac's IPv4 address, filled in at container start by resolve-api-host.sh. Not the name
  # host.docker.internal: it also resolves to an unreachable IPv6 address, and nginx would treat each address
  # as a separate server, sending some requests to a dead one.
  # A refused connection or a 502/503 marks an instance as failed for 2 s; nginx then uses the other one.
  server __API_HOST__:4001 max_fails=1 fail_timeout=2s;
  server __API_HOST__:4002 max_fails=1 fail_timeout=2s;
  keepalive 32;
}

# PUBLIC DEMO RATE LIMIT (Phase 7). Through the Cloudflare tunnel every request carries the visitor's real IP in
# CF-Connecting-IP. Each visitor gets 10 requests/s with bursts of 20, then 429 Too Many Requests. Requests without
# that header (local use, the k6 load test) get an empty key, and nginx doesn't count those at all.
map $http_cf_connecting_ip $public_visitor {
  ""      "";
  default $http_cf_connecting_ip;
}
limit_req_zone $public_visitor zone=public_visitors:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80;

  location / {
    limit_req zone=public_visitors burst=20 nodelay;
    proxy_pass http://booking_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # RETRY POLICY: if an instance refuses the connection (it is shutting down), times out, or answers 502/503
    # (it is draining), send the request to the other instance.
    # `non_idempotent` lets nginx retry POST too. That is normally DANGEROUS (a retried "book" could book
    # twice), and it's safe here ONLY because every write carries an Idempotency-Key: the second attempt replays
    # the first attempt's stored answer instead of running again.
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
    proxy_connect_timeout 2s;

    # Server-Sent Events: don't buffer, and keep long-lived streams open.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
